name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck PKGBUILD
        run: |
          sudo apt-get install -y shellcheck
          shellcheck --shell=bash --severity=error PKGBUILD

      - name: verify .SRCINFO is up to date
        uses: addnab/docker-run-action@v3
        with:
          image: archlinux:base-devel
          options: -v ${{ github.workspace }}:/pkg -w /pkg
          run: |
            pacman -Syu --noconfirm
            useradd -m builder
            chown -R builder /pkg
            su builder -c 'makepkg --printsrcinfo' > /tmp/new.SRCINFO
            if ! diff -u .SRCINFO /tmp/new.SRCINFO; then
              echo "ERROR: .SRCINFO is out of date. Run: makepkg --printsrcinfo > .SRCINFO"
              exit 1
            fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: install build tools
        run: pacman -Syu --noconfirm base-devel namcap sudo

      - name: setup non-root builder
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder .

      - name: build package
        run: su builder -c 'makepkg -s --noconfirm --syncdeps'

      - name: verify package was produced
        run: ls *.pkg.tar.zst | grep -v debug

      - name: namcap check
        run: |
          namcap PKGBUILD || true
          namcap *.pkg.tar.zst | grep -v debug | grep -v W || true

      - name: install + smoke test
        run: |
          pacman -U --noconfirm *.pkg.tar.zst
          llama-cli --version 2>&1 | grep -i "build\|version\|llama" || true
          # Backend-loading regression guard (the reason for the libexec layout):
          # ggml's loader finds its backend plugins only next to the executable or in
          # the CWD. Run from a DIFFERENT cwd (/tmp) and require that backends load —
          # `--version` alone would NOT catch a regressed layout. No GPU on the runner,
          # so Vulkan finds no device; that is fine. The failure we guard against is the
          # loader finding NO backend at all ("no backends are loaded").
          cd /tmp
          out=$(llama-cli --list-devices 2>&1) || true
          echo "$out"
          if grep -qi "no backends are loaded" <<<"$out"; then
            echo "REGRESSION: ggml backends not found from a non-install cwd — check package layout" >&2
            exit 1
          fi
          echo "smoke test OK (backends load from arbitrary cwd)"
