name: bump

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check for new upstream release
        id: check
        run: |
          LATEST=$(curl -s https://api.github.com/repos/ggml-org/llama.cpp/releases/latest | jq -r .tag_name)
          CURRENT=$(grep '^pkgver=' PKGBUILD | cut -d= -f2)
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          if [[ "$LATEST" == "$CURRENT" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already at ${CURRENT}, nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "New upstream release: ${LATEST} (current: ${CURRENT})"
          fi

      - name: verify vulkan asset exists
        if: steps.check.outputs.skip == 'false'
        id: asset
        run: |
          LATEST="${{ steps.check.outputs.latest }}"
          URL="https://github.com/ggml-org/llama.cpp/releases/download/${LATEST}/llama-${LATEST}-bin-ubuntu-vulkan-x64.tar.gz"
          STATUS=$(curl -sIL -o /dev/null -w '%{http_code}' "$URL")
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          if [[ "$STATUS" != "200" ]]; then
            echo "WARNING: Vulkan asset not found for ${LATEST} (HTTP ${STATUS}). Skipping bump."
            echo "missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
            echo "Asset OK: ${URL}"
          fi

      - name: compute sha256
        if: steps.check.outputs.skip == 'false' && steps.asset.outputs.missing == 'false'
        id: sha
        run: |
          SHA=$(curl -sL "${{ steps.asset.outputs.url }}" | sha256sum | cut -d' ' -f1)
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}"

      - name: update PKGBUILD
        if: steps.check.outputs.skip == 'false' && steps.asset.outputs.missing == 'false'
        run: |
          LATEST="${{ steps.check.outputs.latest }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          sed -i \
            "s/^pkgver=.*/pkgver=${LATEST}/; \
             s/^pkgrel=.*/pkgrel=1/; \
             s/^sha256sums=.*/sha256sums=('${SHA}')/" PKGBUILD

      - name: regenerate .SRCINFO
        if: steps.check.outputs.skip == 'false' && steps.asset.outputs.missing == 'false'
        run: |
          # Copy only PKGBUILD to isolated dir so container chown doesn't affect .git/
          mkdir -p /tmp/pkgbuild-src
          cp PKGBUILD /tmp/pkgbuild-src/
          docker run --rm \
            -v /tmp/pkgbuild-src:/build \
            archlinux:base-devel \
            bash -c "pacman -Syu --noconfirm && useradd -m builder && chown -R builder /build && su builder -c 'cd /build && makepkg --printsrcinfo > /tmp/si' && cp /tmp/si /build/.SRCINFO"
          cp /tmp/pkgbuild-src/.SRCINFO .SRCINFO

      - name: build + smoke test (validation gate)
        if: steps.check.outputs.skip == 'false' && steps.asset.outputs.missing == 'false'
        run: |
          # Validate the bump exactly like ci.yml's build job: build the package in
          # a clean Arch container and smoke-test the binary. A failure here fails
          # the job, so only a working bump reaches the auto-merge step below.
          # Build in an isolated copy so the container's chown never touches .git/.
          mkdir -p /tmp/pkgbuild-validate
          cp PKGBUILD /tmp/pkgbuild-validate/
          docker run --rm -v /tmp/pkgbuild-validate:/build -w /build archlinux:base-devel bash -c '
            set -e
            pacman -Syu --noconfirm base-devel sudo
            useradd -m builder
            echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
            chown -R builder /build
            su builder -c "makepkg -s --noconfirm --syncdeps"
            ls /build/*.pkg.tar.zst | grep -v debug
            pacman -U --noconfirm /build/*.pkg.tar.zst
            llama-cli --version 2>&1 | grep -i "build\|version\|llama" || true
            # Backend-loading regression guard (see ci.yml): run from a different cwd
            # and require backends to load. A bump that regressed the libexec layout
            # must fail here, not ship a broken "no backends are loaded" package.
            cd /tmp
            out=$(llama-cli --list-devices 2>&1) || true
            echo "$out"
            if echo "$out" | grep -qi "no backends are loaded"; then
              echo "REGRESSION: ggml backends not found from arbitrary cwd — check layout" >&2
              exit 1
            fi
            echo "smoke test OK (backends load from arbitrary cwd)"
          '

      - name: open pull request
        id: cpr
        if: steps.check.outputs.skip == 'false' && steps.asset.outputs.missing == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Fixed branch keeps a single PR (no per-release backlog). It is created,
          # validated by the build+smoke gate above, and auto-merged below.
          branch: auto-bump
          commit-message: "bump to ${{ steps.check.outputs.latest }}"
          title: "bump to ${{ steps.check.outputs.latest }}"
          body: |
            Automated bump to upstream release [${{ steps.check.outputs.latest }}](https://github.com/ggml-org/llama.cpp/releases/tag/${{ steps.check.outputs.latest }}).

            **sha256:** `${{ steps.sha.outputs.sha256 }}`

            Built and smoke-tested in CI before merge; this PR is auto-merged on success.
            To publish the updated package to the Arch repo:
            ```bash
            cd ~/Workspace/tooling/arch-packages/pkgs/llama.cpp-vulkan-bin && git checkout main && git pull
            cd ~/Workspace/tooling/arch-packages && ./publish.sh llama.cpp-vulkan-bin
            sudo pacman -Syu llama.cpp-vulkan-bin
            ```
          labels: auto-bump
          delete-branch: true

      - name: auto-merge validated bump
        if: steps.check.outputs.skip == 'false' && steps.asset.outputs.missing == 'false' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --squash --delete-branch
